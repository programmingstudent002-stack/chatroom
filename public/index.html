
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 채팅방</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f2f4f8;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    h1, h2 { text-align: center; }
    input, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }
    input { width: 100%; margin: 7px 0; }
    button {
      cursor: pointer;
      background: #5265e8;
      color: white;
      border: none;
      margin: 4px;
    }
    button:hover { opacity: .85; }
    .danger { background: #e34b4b; }
    .success { background: #249c68; }
    .hidden { display: none !important; }
    #status { text-align: center; color: #555; margin: 15px 0; }
    #messages {
      height: 350px;
      overflow-y: auto;
      background: #f7f8fc;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
    }
    .message {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .notice {
      background: #fff3cf;
      border: 1px solid #f0d47a;
    }
    .message small { color: #888; }
    .message-content { margin: 8px 0; white-space: pre-wrap; }
    .member {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .send-area { display: flex; gap: 5px; }
    .send-area input { flex: 1; min-width: 0; }
  </style>
</head>

<body>
<div class="container">
  <h1>💬 우리들의 채팅방</h1>

  <!-- 입장 화면 -->
  <section id="loginSection">
    <h2>입장하기</h2>
    <input id="nameInput" placeholder="이름을 입력하세요">
    <input id="emojiInput" placeholder="나를 표현하는 이모지" value="😊">
    <input id="passwordInput" type="password" placeholder="방장 암호 (방장만)">
    <button id="hostButton" class="success">방장 입장</button>
    <button id="guestButton">손님 입장 요청</button>
    <p id="status" aria-live="polite"></p>
  </section>

  <!-- 대기 화면 -->
  <section id="waitingSection" class="hidden">
    <h2>⏳ 입장 승인 대기 중</h2>
    <p id="waitingStatus" aria-live="polite">방장의 승인을 기다리고 있어요.</p>
  </section>

  <!-- 채팅 화면 -->
  <section id="chatSection" class="hidden">
    <h2>채팅방</h2>

    <!-- 방장 전용 관리 -->
    <div id="hostPanel" class="hidden">
      <h3>👑 입장 대기 목록</h3>
      <div id="waitingList"></div>
      <button id="closeRoomButton" class="danger">방 닫기</button>
      <hr>
    </div>

    <div id="messages"></div>

    <div class="send-area">
      <input id="messageInput" placeholder="메시지를 입력하세요">
      <button id="sendButton">보내기</button>
    </div>

    <div id="noticeArea" class="hidden">
      <button id="noticeButton">공지 보내기</button>
    </div>

    <p id="chatStatus" aria-live="polite"></p>
  </section>
</div>

<script>
const SUPABASE_URL = 'https://smezazodxeybyjizddhe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6EKk1k5RFlWGnbsFXXhCZQ_VlM9wNHA';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let myId = null;
let myName = '';
let myRole = '';
let myEmoji = '😊';

let statusTimer = null;
let messageTimer = null;
let listTimer = null;
let stopped = false;

const $ = id => document.getElementById(id);

function showSection(id) {
  ['loginSection', 'waitingSection', 'chatSection'].forEach(section => {
    $(section).classList.add('hidden');
  });
  $(id).classList.remove('hidden');
}

function showStatus(message) {
  $('status').textContent = message;
}

function stopTimer(name) {
  if (name === 'all' || name === 'status') {
    clearInterval(statusTimer);
    statusTimer = null;
  }
  if (name === 'all' || name === 'messages') {
    clearInterval(messageTimer);
    messageTimer = null;
  }
  if (name === 'all' || name === 'list') {
    clearInterval(listTimer);
    listTimer = null;
  }
}

function stopEverything() {
  stopped = true;
  stopTimer('all');
}

function enterChat() {
  stopTimer('status');
  showSection('chatSection');

  if (myRole === 'host') {
    $('hostPanel').classList.remove('hidden');
    $('noticeArea').classList.remove('hidden');
    loadWaitingMembers();
    listTimer = setInterval(loadWaitingMembers, 2500);
  }

  loadMessages();
  messageTimer = setInterval(loadMessages, 2500);
}

// 방장 입장
$('hostButton').addEventListener('click', async () => {
  const name = $('nameInput').value.trim();
  const password = $('passwordInput').value;

  if (!name) {
    showStatus('이름을 입력하세요.');
    return;
  }

  if (password !== '1234') {
    showStatus('방장 암호가 틀렸습니다.');
    return;
  }

  const { data: existing, error: checkError } = await supabase
    .from('members')
    .select('id')
    .eq('role', 'host')
    .limit(1);

  if (checkError) {
    showStatus('방장 확인 실패: ' + checkError.message);
    return;
  }

  if (existing.length > 0) {
    showStatus('이미 방장이 입장해 있습니다.');
    return;
  }

  const { data, error } = await supabase
    .from('members')
    .insert([{
      name: '방장',
      emoji: $('emojiInput').value.trim() || '👑',
      role: 'host',
      status: 'approved'
    }])
    .select()
    .single();

  if (error) {
    showStatus('방장 입장 실패: ' + error.message);
    return;
  }

  myId = data.id;
  myName = data.name;
  myRole = 'host';
  myEmoji = data.emoji || '👑';

  enterChat();
});

// 손님 입장 요청
$('guestButton').addEventListener('click', async () => {
  const name = $('nameInput').value.trim();

  if (!name) {
    showStatus('이름을 입력하세요.');
    return;
  }

  // 방장 존재 확인
  const { data: hosts, error: hostError } = await supabase
    .from('members')
    .select('id')
    .eq('role', 'host')
    .eq('status', 'approved')
    .limit(1);

  if (hostError) {
    showStatus('방장 확인 실패: ' + hostError.message);
    return;
  }

  if (!hosts || hosts.length === 0) {
    showStatus('방장이 아직 안 들어왔어요');
    return;
  }

  const emoji = $('emojiInput').value.trim() || '😊';

  const { data, error } = await supabase
    .from('members')
    .insert([{
      name: name,
      emoji: emoji,
      role: 'guest',
      status: 'waiting'
    }])
    .select()
    .single();

  if (error) {
    showStatus('입장 요청 실패: ' + error.message);
    return;
  }

  myId = data.id;
  myName = data.name;
  myRole = 'guest';
  myEmoji = emoji;

  showSection('waitingSection');
  checkMyStatus();
  statusTimer = setInterval(checkMyStatus, 2500);
});

// 내 입장 상태 확인
async function checkMyStatus() {
  if (stopped || !myId) return;

  const { data, error } = await supabase
    .from('members')
    .select('id, status')
    .eq('id', myId)
    .maybeSingle();

  if (error) {
    $('waitingStatus').textContent = '상태 확인에 실패했습니다.';
    return;
  }

  if (!data) {
    stopTimer('status');
    $('waitingStatus').textContent = '방에서 나왔어요';
    return;
  }

  if (data.status === 'approved') {
    enterChat();
  }
}

// 방장: 대기자 목록
async function loadWaitingMembers() {
  if (stopped || myRole !== 'host') return;

  const { data, error } = await supabase
    .from('members')
    .select('id, name, emoji')
    .eq('role', 'guest')
    .eq('status', 'waiting')
    .order('created_at', { ascending: true });

  if (error) {
    $('waitingList').textContent = '목록을 불러오지 못했습니다.';
    return;
  }

  const list = $('waitingList');
  list.replaceChildren();

  data.forEach(member => {
    const item = document.createElement('div');
    item.className = 'member';

    const label = document.createElement('span');
    label.textContent = `${member.emoji || '😊'} ${member.name}`;

    const approve = document.createElement('button');
    approve.textContent = '수락';
    approve.className = 'success';
    approve.addEventListener('click', () => updateMember(member.id));

    const reject = document.createElement('button');
    reject.textContent = '거절';
    reject.className = 'danger';
    reject.addEventListener('click', () => deleteMember(member.id));

    item.append(label, approve, reject);
    list.appendChild(item);
  });

  if (data.length === 0) {
    list.textContent = '대기 중인 사람이 없습니다.';
  }
}

// 손님 승인
async function updateMember(id) {
  const { error } = await supabase
    .from('members')
    .update({ status: 'approved' })
    .eq('id', id)
    .eq('role', 'guest')
    .eq('status', 'waiting');

  if (error) alert('승인 실패: ' + error.message);
  loadWaitingMembers();
}

// 손님 거절
async function deleteMember(id) {
  const { error } = await supabase
    .from('members')
    .delete()
    .eq('id', id)
    .eq('role', 'guest');

  if (error) alert('거절 실패: ' + error.message);
  loadWaitingMembers();
}

// 메시지 불러오기
async function loadMessages() {
  if (stopped) return;

  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) {
    $('chatStatus').textContent = '메시지를 불러오지 못했습니다.';
    return;
  }

  const area = $('messages');
  area.replaceChildren();

  data.forEach(msg => {
    const box = document.createElement('div');
    box.className = 'message' + (msg.is_notice ? ' notice' : '');

    const name = document.createElement('strong');
    name.textContent = msg.is_notice ? '📢 공지' : msg.name;

    const content = document.createElement('div');
    content.className = 'message-content';
    content.textContent = msg.content;

    const time = document.createElement('small');
    time.textContent = msg.created_at
      ? new Date(msg.created_at).toLocaleTimeString('ko-KR')
      : '';

    const like = document.createElement('button');
    like.textContent = `❤️ ${msg.likes || 0}`;
    like.addEventListener('click', () => increaseLike(msg.id, msg.likes || 0));

    box.append(name, content, time, like);
    area.appendChild(box);
  });

  area.scrollTop = area.scrollHeight;
}

// 메시지 전송
async function sendMessage(isNotice = false) {
  const content = $('messageInput').value.trim();

  if (!content) return;

  const { error } = await supabase
    .from('messages')
    .insert([{
      name: myName,
      content: content,
      is_notice: isNotice,
      likes: 0
    }]);

  if (error) {
    $('chatStatus').textContent = '전송 실패: ' + error.message;
    return;
  }

  $('messageInput').value = '';
  $('chatStatus').textContent = '';
  loadMessages();
}

$('sendButton').addEventListener('click', () => sendMessage(false));

$('messageInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) {
    e.preventDefault();
    sendMessage(false);
  }
});

// 공지 전송
$('noticeButton').addEventListener('click', () => {
  if (myRole !== 'host') return;
  sendMessage(true);
});

// 좋아요
async function increaseLike(id, currentLikes) {
  const { error } = await supabase
    .from('messages')
    .update({ likes: currentLikes + 1 })
    .eq('id', id);

  if (error) {
    $('chatStatus').textContent = '좋아요 실패: ' + error.message;
    return;
  }

  loadMessages();
}

// 방 닫기
$('closeRoomButton').addEventListener('click', async () => {
  if (myRole !== 'host' || !confirm('정말 방을 닫을까요? 모든 기록이 삭제됩니다.')) {
    return;
  }

  stopEverything();

  // 먼저 메시지 전체 삭제
  const { error: messageError } = await supabase
    .from('messages')
    .delete()
    .not('id', 'is', null);

  if (messageError) {
    alert('메시지 삭제 실패: ' + messageError.message);
    stopped = false;
    return;
  }

  // 멤버 전체 삭제
  const { error: memberError } = await supabase
    .from('members')
    .delete()
    .not('id', 'is', null);

  if (memberError) {
    alert('회원 삭제 실패: ' + memberError.message);
    return;
  }

  alert('채팅방이 닫혔습니다.');

  myId = null;
  myRole = '';
  myName = '';
  showSection('loginSection');
});
</script>
</body>
</html>
