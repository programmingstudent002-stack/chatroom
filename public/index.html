<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쉬는 방</title>
  <!-- Socket.IO 클라이언트 라이브러리 자동 로드 -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 20% 30%, #ffffff, transparent),
        radial-gradient(1px 1px at 70% 20%, #a3bffa, transparent),
        radial-gradient(2px 2px at 40% 70%, #ffffff, transparent),
        radial-gradient(1px 1px at 85% 65%, #e2e8f0, transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, #cbd5e1, transparent),
        radial-gradient(1px 1px at 55% 40%, #ffffff, transparent);
      opacity: 0.55;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(20, 28, 43, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    .screen {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .moon-icon {
      font-size: 36px;
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .notice-box {
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.7);
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #818cf8;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .host-login-section {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
    }

    .host-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
      display: block;
    }

    .host-input-row {
      display: flex;
      gap: 8px;
    }

    .host-input-row input {
      padding: 9px 12px;
      font-size: 13px;
    }

    .btn-host {
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      white-space: nowrap;
      font-size: 13px;
    }

    .btn-host:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 화면 2: 입장 확인 중 */
    .waiting-box {
      text-align: center;
      padding: 40px 10px;
    }

    .pulse-circle {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(129, 140, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.5); }
      70% { box-shadow: 0 0 0 18px rgba(129, 140, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); }
    }

    .waiting-text {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .waiting-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      padding: 10px 18px;
      font-size: 13px;
    }

    /* 화면 3: 채팅방 */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-title {
      font-size: 18px;
      font-weight: 700;
    }

    .participants {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .badge-role {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
    }

    .announcement-bar {
      margin-top: 12px;
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: #fef08a;
    }

    .host-notice-edit {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .host-notice-edit input {
      padding: 7px 10px;
      font-size: 12px;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .chat-messages {
      height: 320px;
      overflow-y: auto;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 86%;
      display: flex;
      flex-direction: column;
    }

    .msg.other {
      align-self: flex-start;
    }

    .msg.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-sender {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg.other .msg-bubble {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg.me .msg-bubble {
      background: #4f46e5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .chat-link {
      color: #93c5fd;
      text-decoration: underline;
      word-break: break-all;
    }

    .msg.me .chat-link {
      color: #e0e7ff;
    }

    .translated-text {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.25);
      font-size: 13px;
      color: #fde047;
    }

    .proofread-box {
      margin-top: 6px;
      background: rgba(244, 63, 94, 0.16);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
      color: #fecdd3;
      line-height: 1.5;
      width: 100%;
    }

    .proofread-title {
      font-weight: 700;
      color: #fda4af;
      margin-bottom: 4px;
    }

    .proofread-item {
      margin-top: 4px;
      word-break: break-word;
    }

    .proofread-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      margin-right: 4px;
      background: rgba(244, 63, 94, 0.3);
      color: #ffe4e6;
    }

    .proofread-fix {
      color: #86efac;
      font-weight: 600;
    }

    .proofread-full {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
    }

    .msg-tools {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-msg-tool {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 8px;
    }

    .btn-msg-tool:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .msg-system {
      align-self: center;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 12px;
      border-radius: 20px;
      text-align: center;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-send {
      padding: 0 18px;
      background: #6366f1;
      color: white;
      white-space: nowrap;
    }

    .host-panel {
      margin-top: 16px;
      padding: 14px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: 16px;
    }

    .host-panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 10px;
    }

    .waiting-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .waiting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-accept {
      background: #10b981;
      color: #064e3b;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-reject {
      background: rgba(244, 63, 94, 0.2);
      color: #fda4af;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-close-room {
      width: 100%;
      padding: 10px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 13px;
    }

    .btn-close-room:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .exit-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      background: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- [화면 1: 입구] -->
    <div id="screen-entrance" class="screen active">
      <div class="moon-icon">🌙</div>
      <h1>쉬는 방</h1>
      <p class="subtitle">내 친구들과 내가 쓰는 조용한 밤의 공간</p>

      <div class="notice-box">
        ✨ 방장이 먼저 들어와야 입장할 수 있어요.
      </div>

      <input type="text" id="guest-nickname" placeholder="사용할 닉네임을 입력하세요" maxlength="12" onkeypress="if(event.key==='Enter') requestEnter()" />
      <button class="btn-primary" onclick="requestEnter()">입장 요청하기</button>

      <div class="host-login-section">
        <span class="host-label">🔑 방장 입장</span>
        <div class="host-input-row">
          <input type="password" id="host-password" placeholder="방장 암호 (기본: 1234)" onkeypress="if(event.key==='Enter') enterAsHost()" />
          <button class="btn-host" onclick="enterAsHost()">방장으로 입장</button>
        </div>
      </div>
    </div>

    <!-- [화면 2: 입장 확인 중] -->
    <div id="screen-waiting" class="screen">
      <div class="waiting-box">
        <div class="pulse-circle">✨</div>
        <p class="waiting-text">방장이 수락하면 바로 들어가요</p>
        <p class="waiting-sub"><strong id="waiting-user-name">친구</strong>님의 입장을 방장에게 요청했어요...</p>
        <button class="btn-outline" onclick="cancelWaiting()">입장 취소하고 돌아가기</button>
      </div>
    </div>

    <!-- [화면 3: 채팅방] -->
    <div id="screen-chat" class="screen">
      <div class="chat-header">
        <div>
          <div class="chat-title">🌙 쉬는 방</div>
          <div class="participants" id="participant-list">참여 중(0)</div>
        </div>
        <span class="badge-role" id="role-badge">친구</span>
      </div>

      <!-- 공지사항 -->
      <div class="announcement-bar">
        <div class="announcement-top">
          <span>📢 <strong>공지:</strong> <span id="notice-text">오늘도 수고 많았어. 편하게 쉬다 가자 🌌</span></span>
        </div>
        <div id="host-notice-control" class="host-notice-edit" style="display: none;">
          <input type="text" id="notice-input" placeholder="새 공지 내용을 입력하세요" onkeypress="if(event.key==='Enter') updateNotice()" />
          <button class="btn-small btn-host" onclick="updateNotice()">공지 올리기</button>
        </div>
      </div>

      <!-- 대화창 -->
      <div class="chat-messages" id="chat-messages"></div>

      <!-- 메시지 입력 -->
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="조용히 메시지 남기기..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="btn-send" onclick="sendMessage()">보내기</button>
      </div>

      <!-- 방장 전용 관리 패널 -->
      <div id="host-panel" class="host-panel" style="display: none;">
        <div class="host-panel-title">👑 입장을 기다리는 사람</div>
        <ul class="waiting-list" id="waiting-list">
          <li style="font-size:12px; color:#64748b; text-align:center; padding:8px;">대기 중인 친구가 없습니다.</li>
        </ul>
        <button class="btn-close-room" onclick="closeRoom()">방 닫기</button>
      </div>

      <button id="guest-exit-btn" class="exit-link" onclick="leaveRoom()">입구로 나가기</button>
    </div>

  </div>

  <script>
    const socket = io();
    let myName = "";
    let isHost = false;

    function goScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // [화면 1] 친구 입장 요청
    function requestEnter() {
      const nickname = document.getElementById('guest-nickname').value.trim();
      if (!nickname) {
        alert("닉네임을 입력해 주세요!");
        return;
      }
      socket.emit('guest-request', nickname);
    }

    // [화면 1] 방장 입장
    function enterAsHost() {
      const pw = document.getElementById('host-password').value.trim();
      if (!pw) {
        alert("방장 암호를 입력해 주세요!");
        return;
      }
      socket.emit('host-login', pw);
    }

    // 대기 취소
    function cancelWaiting() {
      location.reload();
    }

    // 방 나가기
    function leaveRoom() {
      if (confirm("채팅방에서 나갈까요?")) {
        location.reload();
      }
    }

    // 공지 수정
    function updateNotice() {
      const input = document.getElementById('notice-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('update-notice', text);
      input.value = "";
    }

    // 메시지 보내기
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('send-message', text);
      input.value = "";
    }

    // 방장 수락/거절
    function respondRequest(targetId, accept) {
      socket.emit('handle-request', { targetId, accept });
    }

    // 방 닫기
    function closeRoom() {
      if (confirm("정말 방을 닫을까요? 모든 친구가 입구로 이동합니다.")) {
        socket.emit('close-room');
      }
    }

    // --- 서버 실시간 이벤트 수신 ---

    socket.on('login-error', (msg) => {
      alert(msg);
    });

    socket.on('waiting-approved-pending', (name) => {
      myName = name;
      document.getElementById('waiting-user-name').innerText = name;
      goScreen('screen-waiting');
    });

    socket.on('request-rejected', (msg) => {
      alert(msg);
      goScreen('screen-entrance');
    });

    socket.on('enter-success', (data) => {
      isHost = data.isHost;
      myName = data.name;

      document.getElementById('role-badge').innerText = isHost ? "👑 방장" : "🌙 친구";
      document.getElementById('host-panel').style.display = isHost ? "block" : "none";
      document.getElementById('host-notice-control').style.display = isHost ? "flex" : "none";
      document.getElementById('guest-exit-btn').style.display = isHost ? "none" : "block";

      document.getElementById('notice-text').innerText = data.notice;
      updateParticipantsUI(data.participants);
      if (isHost) renderWaitingList(data.waitingList);

      const chatBox = document.getElementById('chat-messages');
      chatBox.innerHTML = "";
      data.messages.forEach(msg => appendMessageToUI(msg));

      goScreen('screen-chat');
    });

    socket.on('room-state', (state) => {
      updateParticipantsUI(state.participants);
      document.getElementById('notice-text').innerText = state.notice;
    });

    socket.on('notice-updated', (newNotice) => {
      document.getElementById('notice-text').innerText = newNotice;
    });

    socket.on('waiting-list-update', (list) => {
      renderWaitingList(list);
    });

    socket.on('new-message', (msgObj) => {
      appendMessageToUI(msgObj);
    });

    socket.on('room-closed', (reason) => {
      alert(reason);
      location.reload();
    });

    // --- UI 렌더링 및 부가 기능 (복사 / 번역 / 링크 / 맞춤법·띄어쓰기) ---

    function updateParticipantsUI(list) {
      document.getElementById('participant-list').innerText = `참여 중(${list.length}): ${list.join(', ')}`;
    }

    function renderWaitingList(list) {
      const ul = document.getElementById('waiting-list');
      if (!list || list.length === 0) {
        ul.innerHTML = '<li style="font-size:12px; color:#64748b; text-align:center; padding:8px;">대기 중인 친구가 없습니다.</li>';
        return;
      }
      ul.innerHTML = "";
      list.forEach(item => {
        const li = document.createElement('li');
        li.className = 'waiting-item';
        li.innerHTML = `
          <span>${escapeHtml(item.name)}</span>
          <div class="action-btns">
            <button class="btn-accept" onclick="respondRequest('${item.id}', true)">수락</button>
            <button class="btn-reject" onclick="respondRequest('${item.id}', false)">거절</button>
          </div>
        `;
        ul.appendChild(li);
      });
    }

    function appendMessageToUI(msgObj) {
      const chatBox = document.getElementById('chat-messages');

      if (msgObj.isSystem) {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'msg-system';
        sysDiv.innerText = msgObj.text;
        chatBox.appendChild(sysDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return;
      }

      const isMe = msgObj.senderId === socket.id;
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${isMe ? 'me' : 'other'}`;

      const linkedHtml = linkify(escapeHtml(msgObj.text));
      const cleanText = msgObj.text.replace(/https?:\/\/[^\s]+/g, '').trim();
      const hasKorean = /[가-힣]/.test(cleanText);
      const hasForeign = /[a-zA-Z\u3040-\u30ff\u4e00-\u9faf]/.test(cleanText);

      const senderSpan = document.createElement('span');
      senderSpan.className = 'msg-sender';
      senderSpan.innerText = msgObj.sender;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'msg-bubble';
      bubbleDiv.innerHTML = linkedHtml;

      const proofSlot = document.createElement('div');

      const toolsDiv = document.createElement('div');
      toolsDiv.className = 'msg-tools';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-msg-tool';
      copyBtn.innerText = '📋 복사';
      copyBtn.onclick = () => copyText(msgObj.text, copyBtn);
      toolsDiv.appendChild(copyBtn);

      if (hasForeign) {
        const transBtn = document.createElement('button');
        transBtn.className = 'btn-msg-tool';
        transBtn.innerText = '🌐 번역';
        transBtn.onclick = () => translateMessage(cleanText || msgObj.text, bubbleDiv, transBtn);
        toolsDiv.appendChild(transBtn);
      }

      msgDiv.appendChild(senderSpan);
      msgDiv.appendChild(bubbleDiv);
      msgDiv.appendChild(proofSlot);
      msgDiv.appendChild(toolsDiv);

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (hasKorean) {
        const checkResult = checkKoreanGrammarAndSpacing(cleanText);
        if (checkResult.hasError) {
          const box = document.createElement('div');
          box.className = 'proofread-box';

          let html = `<div class="proofread-title">✍️ 맞춤법 · 띄어쓰기가 틀렸어요!</div>`;
          checkResult.items.forEach(item => {
            html += `
              <div class="proofread-item">
                <span class="proofread-tag">${item.type}</span>
                <span>'${escapeHtml(item.wrong)}' → <span class="proofread-fix">'${escapeHtml(item.right)}'</span></span>
              </div>
            `;
          });

          if (checkResult.correctedSentence && checkResult.correctedSentence !== cleanText) {
            html += `<div class="proofread-full">💡 바른 문장: <span class="proofread-fix">${escapeHtml(checkResult.correctedSentence)}</span></div>`;
          }

          box.innerHTML = html;
          proofSlot.appendChild(box);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }
    }

    function checkKoreanGrammarAndSpacing(text) {
      const items = [];
      let corrected = text;

      const addIssue = (type, wrong, right) => {
        if (!wrong || !right || wrong === right) return;
        if (!items.some(it => it.wrong === wrong && it.right === right)) {
          items.push({ type, wrong, right });
        }
      };

      const spellingRules = [
        { regex: /안됀|안돼는|안됄|안됐어|안되요|안되서|안되야|안되도/g, fix: s => s
          .replace(/안됀/g, '안 된').replace(/안돼는/g, '안 되는').replace(/안됄/g, '안 될').replace(/안됐/g, '안 됐')
          .replace(/안되요/g, '안 돼요').replace(/안되서/g, '안 돼서').replace(/안되야/g, '안 돼야').replace(/안되도/g, '안 돼도')
        },
        { regex: /(^|\s)(되요|되서|되야|되도)/g, fix: s => s.replace('되', '돼') },
        { regex: /(^|\s)(돼서|돼야|돼도|돼고|돼지|돼면|돼는|돼니)/g, fix: s => s.replace('돼', '되') },
        { regex: /어의없([가-힣]*)/g, fix: s => s.replace('어의', '어이') },
        { regex: /문안하([가-힣]*)/g, fix: s => s.replace('문안', '무난') },
        { regex: /금새/g, fix: () => '금세' },
        { regex: /몇일/g, fix: () => '며칠' },
        { regex: /오랫만([가-힣]*)/g, fix: s => s.replace('오랫만', '오랜만') },
        { regex: /설레임([가-힣]*)/g, fix: s => s.replace('설레임', '설렘') },
        { regex: /어떻해/g, fix: () => '어떡해' },
        { regex: /어떡계|어떻계/g, fix: () => '어떻게' },
        { regex: /([가-힣]+)(할께|갈께|볼께|줄께|먹을께|할께요|갈께요|볼께요)/g, fix: s => s.replace('께', '게') },
        { regex: /일부로/g, fix: () => '일부러' },
        { regex: /역활/g, fix: () => '역할' },
        { regex: /바램/g, fix: () => '바람' },
        { regex: /갯수/g, fix: () => '개수' },
        { regex: /댓가/g, fix: () => '대가' },
        { regex: /([가-힣]+)(햇어|햇다|햇는데|햇지|햇니|갔엇|먹었엇|했엇|왓어|봣어|줫어)/g, fix: s => s
          .replace(/햇/g, '했').replace(/엇/g, '었').replace(/왓/g, '왔').replace(/봣/g, '봤').replace(/줫/g, '줬')
        },
        { regex: /([가-힣]*)(잇어|잇다|잇는데|잇지|잇니|잇음|없엇)/g, fix: s => s.replace(/잇/g, '있').replace(/엇/g, '었') },
        { regex: /([가-힣]*)(마춰|마추다|마췄)/g, fix: s => s.replace(/마춰/g, '맞춰').replace(/마추/g, '맞추').replace(/마췄/g, '맞췄') },
        { regex: /감기\s?낳([가-힣]*)|병이\s?낳([가-힣]*)/g, fix: s => s.replace('낳', '나') },
        { regex: /건들([지어면고])/g, fix: s => s.replace('건들', '건드리') },
        { regex: /희안하([가-힣]*)/g, fix: s => s.replace('희안', '희한') },
        { regex: /예기([가-힣]*)/g, fix: s => s.replace('예기', '얘기') },
        { regex: /([가-힣]*)(뵈요|봬어|봬었)/g, fix: s => s.replace('뵈요', '봬요').replace('봬어', '뵈어').replace('봬었', '뵈었') },
        { regex: /무릅/g, fix: () => '무릎' },
        { regex: /([가-힣]+)읍니다/g, fix: s => s.replace('읍니다', '습니다') },
        { regex: /([가-힣]+)던지\s([가-힣]+)던지/g, fix: s => s.replace(/던지/g, '든지') },
        { regex: /([가-힣]+)데로/g, fix: s => s.replace('데로', '대로') },
        { regex: /([가-힣]+[을를은는이가])예요/g, fix: s => s.replace('예요', '에요') }
      ];

      spellingRules.forEach(rule => {
        const matches = [...corrected.matchAll(rule.regex)];
        matches.forEach(m => {
          const wrong = m[0].trim();
          const right = rule.fix(m[0]).trim();
          if (wrong !== right) {
            addIssue("맞춤법", wrong, right);
            corrected = corrected.replace(m[0], rule.fix(m[0]));
          }
        });
      });

      const spacingRules = [
        { regex: /([가-힣]+[을를은는의])(수|것|거|데|바|줄|뿐|척|채|만큼|대로)([가-힣]*)/g, fix: m => `${m[1]} ${m[2]}${m[3]}` },
        { regex: /([가-힣]{2,}[아어해])(줘|주|봐|보|버렸|버려|놓|놔|둬|두|가|오|싶|있|없)([가-힣]*)/g, fix: m => `${m[1]} ${m[2]}${m[3]}` },
        { regex: /(^|\s)(안|못)([가-힣]{2,})/g, fix: m => {
          const keep = ['안녕', '안전', '안내', '안심', '안경', '안타', '안개', '안부', '안정', '안팎', '안주', '안방', '안과', '안보', '못난', '못생', '못지', '못하'];
          if (keep.some(w => (m[2] + m[3]).startsWith(w))) return m[0];
          return `${m[1]}${m[2]} ${m[3]}`;
        }},
        { regex: /(^|\s)(더|또|잘|다|좀|막|꼭|참|너무|매우|정말|진짜|완전|항상|자주|이미|벌써|아직|다시|함께|같이)([가-힣]{2,})/g, fix: m => `${m[1]}${m[2]} ${m[3]}` },
        { regex: /(^|\s)(이|그|저)(사람|친구|거|것|곳|날|때|말|일|집|책|분)/g, fix: m => `${m[1]}${m[2]} ${m[3]}` },
        { regex: /오늘도수고|잘자|좋은밤/g, fix: m => {
          if (m[0] === '오늘도수고') return '오늘도 수고';
          if (m[0] === '잘자') return '잘 자';
          if (m[0] === '좋은밤') return '좋은 밤';
          return m[0];
        }},
        { regex: /([가-힣]{1,}[을를은는이가에로의와과도만])([가-힣]{2,})/g, fix: m => {
          const endings = ['입니다', '습니다', '합니다', '됩니다', '였어요', '었어요', '았어요', '했어요', '는데요', '거든요', '잖아요', '주세요', '보세요', '인가요', '인데요', '에서', '에게', '한테', '으로', '부터', '까지', '처럼', '같이', '보다', '마다', '조차', '마저', '밖에'];
          if (endings.some(end => (m[1] + m[2]).endsWith(end) || m[2].startsWith(end))) return m[0];
          return `${m[1]} ${m[2]}`;
        }},
        { regex: /\s{2,}/g, fix: () => ' ' }
      ];

      spacingRules.forEach(rule => {
        const matches = [...corrected.matchAll(rule.regex)];
        matches.forEach(m => {
          const wrong = m[0].trim();
          const right = rule.fix(m).trim();
          if (wrong !== right) {
            addIssue("띄어쓰기", wrong, right);
            corrected = corrected.replace(m[0], rule.fix(m));
          }
        });
      });

      const longTokens = corrected.split(/\s+/).filter(token => /^[가-힣]{6,}$/.test(token));
      longTokens.forEach(token => {
        addIssue("띄어쓰기", token, "단어 사이에 띄어쓰기가 필요해요");
      });

      return { hasError: items.length > 0, items, correctedSentence: corrected };
    }

    function linkify(escapedText) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return escapedText.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url} ↗</a>`;
      });
    }

    function copyText(text, btn) {
      const showCopied = () => {
        const origin = btn.innerText;
        btn.innerText = '✅ 복사됨';
        setTimeout(() => { btn.innerText = origin; }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
      } else {
        fallbackCopy(text, showCopied);
      }
    }

    function fallbackCopy(text, callback) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        callback();
      } catch (e) {
        alert("복사에 실패했습니다.");
      }
      document.body.removeChild(textarea);
    }

    async function translateMessage(text, bubbleDiv, btn) {
      if (bubbleDiv.querySelector('.translated-text')) return;

      btn.innerText = '번역 중...';
      btn.disabled = true;

      let translated = "";
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        if (Array.isArray(data) && Array.isArray(data[0])) {
          translated = data[0].map(item => item[0]).join('');
        }
      } catch (e) {
        try {
          const res2 = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
          const data2 = await res2.json();
          translated = data2.responseData?.translatedText || "";
        } catch (e2) {}
      }

      if (translated) {
        const transBox = document.createElement('div');
        transBox.className = 'translated-text';
        transBox.innerText = `🌐 ${translated}`;
        bubbleDiv.appendChild(transBox);
        btn.innerText = '번역 완료';
      } else {
        btn.innerText = '🌐 번역 실패';
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
